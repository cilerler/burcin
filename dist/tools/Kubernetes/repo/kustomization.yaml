apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization
resources:
- ../base
patches:
- patch: |-
    - op: replace
      path: /metadata/name
      value: burcinapp
    - op: replace
      path: /spec/template/spec/containers/0/name
      value: burcinapp
    - op: replace
      path: /spec/template/spec/volumes/0/secret/secretName
      value: burcinapp
  target:
    kind: Deployment
    name: app
- patch: |-
    - op: replace
      path: /metadata/name
      value: burcinapp
  target:
    kind: Service
    name: app
- patch: |-
    - op: replace
      path: /metadata/name
      value: burcinapp
  target:
    kind: ConfigMap
    name: app
labels:
- includeSelectors: true
  pairs:
    app: burcinapp
images:
- name: app-image:latest
  newName: ghcr.io/burcinco/burcinapp
  newTag: snapshot
