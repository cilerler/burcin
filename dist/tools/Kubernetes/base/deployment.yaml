apiVersion: apps/v1
kind: Deployment
metadata:
  name: app
spec:
  replicas: 2
  template:
    metadata:
      annotations:
        prometheus.io/path: /metrics
        prometheus.io/port: "8080"
        prometheus.io/scrape: "true"
    spec:
      enableServiceLinks: false
      imagePullSecrets:
      - name: github-dockerconfigjson
      containers:
      - securityContext:
          runAsNonRoot: true
          allowPrivilegeEscalation: false
          readOnlyRootFilesystem: true
          capabilities:
            drop:
            - ALL
        livenessProbe:
          httpGet:
            path: /healthz/live
            port: 8080
            httpHeaders:
            - name: probe
              value: liveness
          initialDelaySeconds: 10
          timeoutSeconds: 1
          periodSeconds: 60
          failureThreshold: 3
        readinessProbe:
          httpGet:
            path: /healthz/ready
            port: 8080
            httpHeaders:
            - name: probe
              value: readiness
          initialDelaySeconds: 5
          timeoutSeconds: 1
          periodSeconds: 180
          failureThreshold: 3
        resources:
          requests:
            memory: 128Mi
            cpu: 125m
            ephemeral-storage: "1Gi"
          limits:
            memory: 256Mi
            cpu: 250m
            ephemeral-storage: "2Gi"
        env:
        - name: ASPNETCORE_ENVIRONMENT
          value: Development
        name: app
        image: app-image:latest
        imagePullPolicy: IfNotPresent
        ports:
        - containerPort: 8080
          protocol: TCP
          name: http
        - containerPort: 8081
          protocol: TCP
          name: https
        volumeMounts:
          - name: secret-volume
            mountPath: /app/configuration/secret
          - name: configmap-volume
            mountPath: /app/configuration/configmap
      volumes:
        - name: secret-volume
          secret:
            secretName: app
        - name: configmap-volume
          configMap:
            name: app
      terminationGracePeriodSeconds: 60
  strategy:
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
    type: RollingUpdate
