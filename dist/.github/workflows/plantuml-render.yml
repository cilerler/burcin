name: Render PlantUML SVGs

on:
  pull_request:
    paths:
      - '**/*.puml'
      - '**/*.plantuml'
      - '.github/workflows/plantuml-render.yml'
  push:
    branches: [main]
    paths:
      - '**/*.puml'
      - '**/*.plantuml'

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: pwsh
    steps:
      - name: Checkout writable branch
        if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event_name == 'pull_request' && github.event.pull_request.head.ref || github.ref }}

      - name: Checkout fork pull request
        if: github.event_name == 'pull_request' && github.event.pull_request.head.repo.full_name != github.repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          repository: ${{ github.repository }}
          ref: refs/pull/${{ github.event.pull_request.number }}/merge

      - name: Determine changed PlantUML files
        id: changed
        run: |
          if ('${{ github.event_name }}' -eq 'pull_request') {
            $base = '${{ github.event.pull_request.base.sha }}'
            $head = '${{ github.event.pull_request.head.sha }}'
          } else {
            $base = '${{ github.event.before }}'
            $head = '${{ github.sha }}'
          }

          if ($base -match '^0{40}$') {
            # A repository's first push has no base commit. Treat every current
            # PlantUML source as new instead of asking git to diff the zero SHA.
            $changed = @(git ls-tree -r --name-only $head -- '*.puml' '*.plantuml')
            if ($LASTEXITCODE -ne 0) { throw "git ls-tree failed with exit code $LASTEXITCODE" }
            $deleted = @()
          } else {
            $changed = @(git diff --name-only --diff-filter=ACM $base $head -- '*.puml' '*.plantuml')
            if ($LASTEXITCODE -ne 0) { throw "git diff for changed PlantUML files failed with exit code $LASTEXITCODE" }
            $deleted = @(git diff --name-only --diff-filter=D $base $head -- '*.puml' '*.plantuml')
            if ($LASTEXITCODE -ne 0) { throw "git diff for deleted PlantUML files failed with exit code $LASTEXITCODE" }
          }

          if ($changed.Count -eq 0 -and $deleted.Count -eq 0) {
            Write-Host "No PlantUML files changed."
          } else {
            Write-Host "Changed: $($changed -join ', ')"
            Write-Host "Deleted: $($deleted -join ', ')"
          }

          "changed=$($changed -join ' ')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          "deleted=$($deleted -join ' ')" | Out-File -FilePath $env:GITHUB_OUTPUT -Append

      - name: Render SVGs and detect drift
        id: render
        if: steps.changed.outputs.changed != '' || steps.changed.outputs.deleted != ''
        run: |
          $ErrorActionPreference = 'Stop'
          $modified = @()
          $mountPath = ((Resolve-Path '.').Path -replace '\\', '/')
          $plantUmlImage = 'plantuml/plantuml@sha256:f2c8916a795483bf32ea61ca63b1c6726845c0085c997d86431e20b52ca1c257'

          # Handle deletions first
          $deletedFiles = '${{ steps.changed.outputs.deleted }}'.Trim() -split '\s+' | Where-Object { $_ }
          foreach ($puml in $deletedFiles) {
            $dir = Split-Path $puml -Parent
            $base = [System.IO.Path]::GetFileNameWithoutExtension($puml)
            $svg = if ($dir) { Join-Path $dir "$base.svg" } else { "$base.svg" }
            if (Test-Path $svg) {
              Write-Host "Removing orphaned SVG: $svg"
              git rm $svg
              $modified += $svg
            }
          }

          # Render changed files
          $changedFiles = '${{ steps.changed.outputs.changed }}'.Trim() -split '\s+' | Where-Object { $_ }
          foreach ($puml in $changedFiles) {
            if (-not (Test-Path $puml)) { continue }

            $dir = Split-Path $puml -Parent
            $base = [System.IO.Path]::GetFileNameWithoutExtension($puml)
            $svg = if ($dir) { Join-Path $dir "$base.svg" } else { "$base.svg" }

            $oldHash = if (Test-Path $svg) { (Get-FileHash $svg -Algorithm SHA256).Hash } else { $null }

            $pumlArgs = @(
              'run', '--rm',
              '-v', "${mountPath}:/data",
              '-w', '/data',
              $plantUmlImage,
              '-tsvg', '-nometadata', '-failfast2', '-o', '.',
              $puml
            )
            & docker @pumlArgs
            if ($LASTEXITCODE -ne 0) {
              Write-Host "::error file=$puml::PlantUML render failed"
              exit 1
            }

            if (-not (Test-Path $svg)) {
              Write-Host "::error file=$puml::Expected SVG not produced: $svg"
              exit 1
            }

            & ./tools/git/scripts/normalize-plantuml-template-svg.ps1 -SvgPath $svg

            $newHash = (Get-FileHash $svg -Algorithm SHA256).Hash

            if ($oldHash -ne $newHash) {
              Write-Host "Updated: $svg"
              $modified += $svg
            } else {
              Write-Host "Unchanged: $svg"
            }
          }

          if ($modified.Count -gt 0) {
            "drift=true" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
            Write-Host "::notice::$($modified.Count) SVG(s) need to be committed"
          } else {
            "drift=false" | Out-File -FilePath $env:GITHUB_OUTPUT -Append
          }

      - name: Commit and push SVGs
        if: steps.render.outputs.drift == 'true'
        run: |
          # Skip push for fork PRs (no write access to head repo)
          $isFork = '${{ github.event.pull_request.head.repo.full_name }}' -ne '' -and `
                    '${{ github.event.pull_request.head.repo.full_name }}' -ne '${{ github.repository }}'

          if ($isFork) {
            Write-Host "::error::PR is from a fork. Stage the changed PlantUML source, run 'pwsh -NoProfile -File ./tools/git/scripts/plantuml-render.ps1', commit the generated SVG, and re-push."
            exit 1
          }

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add '*.svg'
          git commit -m 'chore: update PlantUML SVGs'
          git push
